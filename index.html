<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>NEON DASH — 02:17 · 5dk</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23050512'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%2300e5ff' stroke-width='4'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css?v=demo5bb" />
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="hud">
      <div id="hud-left">
        <span id="mem">◆ 0/1</span>
        <span id="room-tag">ホテル</span>
      </div>
      <button id="btn-pause" type="button" aria-label="Pause">☰</button>
    </div>
    <div id="say" class="hidden"></div>
    <div id="loading">02:17 yükleniyor…</div>

    <div id="touch" class="hidden">
      <div id="pad-left">
        <button data-k="left" type="button">◀</button>
        <button data-k="right" type="button">▶</button>
      </div>
      <div id="pad-right">
        <button data-k="crouch" type="button">S</button>
        <button data-k="dash" type="button">DASH</button>
        <button data-k="jump" class="jump" type="button">JUMP</button>
        <button data-k="use" type="button">E</button>
      </div>
    </div>

    <div id="menu" class="hidden">
      <div class="panel">
        <h2>PAUSE</h2>
        <button data-act="resume">Devam</button>
        <button data-act="reset">Odayı baştan</button>
        <button data-act="hub">Lobiye dön</button>
        <button data-act="title">Title</button>
      </div>
    </div>

    <div id="endcard" class="hidden">
      <div class="panel">
        <h2>5 DK DİLİM</h2>
        <p id="end-text">Servis damgası alındı. Otel seni hâlâ tutuyor.</p>
        <p class="sub">Beğenirsen 30 dk geceyi açarız.</p>
        <button data-act="replay">Tekrar</button>
        <button data-act="title2">Title</button>
      </div>
    </div>
  </div>
  <script src="game.js?v=demo5bb"></script>
</body>
</html>
